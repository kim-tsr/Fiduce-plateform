# Prometheus local (dev) : scrape les endpoints /metrics des services.
# En production, ce rôle revient à la stack d'observabilité que VOUS déployez
# (Prometheus Operator, agents, etc.) — hors périmètre de ce dépôt applicatif.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: fiduce-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
          - auth:8000
          - ledger:8000
          - reporting:8000
          - worker:8000

# Configuration nginx pour le frontend Fiduce (image nginx-unprivileged).
# Écoute sur 8080 (port non privilégié). Sert les fichiers statiques et
# proxifie /api vers la gateway. En local (docker-compose) l'hôte "gateway"
# est résolu par le réseau Compose ; en Kubernetes, l'ingress route /api.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité de base (à compléter côté plateforme : CSP, HSTS…).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA sans empreinte dans le nom des fichiers (app.js / index.html) : on force
    # une revalidation systématique via l'ETag. Sans Cache-Control, le navigateur
    # applique un cache heuristique et continue de servir l'ancien JS après un
    # rebuild (la réponse 304 reste peu coûteuse quand le contenu n'a pas changé).
    add_header Cache-Control "no-cache" always;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

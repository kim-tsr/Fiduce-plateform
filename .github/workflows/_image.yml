name: _image

on:
    workflow_call:
      inputs:
        service:
          type: string
          required: true
        context:
          type: string
          required: true
        dockerfile:
          type: string
          required: true
        push:
          type: boolean
          required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fiduce-${{ inputs.service }}
  TRIVY_VERSION: v0.75.0

jobs:
    build:
        runs-on: ubuntu-24.04
        permissions:
          contents: read
          packages: write
        outputs:
          digest: ${{ steps.push.outputs.digest }}
        steps:
        
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        
        - name: Lint Dockerfile (hadolint)
          uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
          with:
            dockerfile: ${{ inputs.dockerfile }}
        
        - name: Dossier du service
          id: src
          env:
            DOCKERFILE: ${{ inputs.dockerfile }}
          run: echo "dir=$(dirname "$DOCKERFILE")" >> "$GITHUB_OUTPUT"

        - name: SCA (Trivy, dépendances du service)
          uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
          with:
            scan-type: fs
            scan-ref: ${{ steps.src.outputs.dir }}
            scanners: vuln
            version: ${{ env.TRIVY_VERSION }}
            severity: HIGH,CRITICAL
            ignore-unfixed: true
            exit-code: "1"
            
        - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

        - name: Calcul des tags
          id: meta
          uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
          with:
            images: ${{ env.IMAGE }}
            tags: |
                type=sha,format=long

        - name: Build unique (chargement local)
          uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
          with:
            context: ${{ inputs.context }}
            file: ${{ inputs.dockerfile }}
            platforms: linux/amd64
            load: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha,scope=${{ inputs.service }}
            cache-to: type=gha,scope=${{ inputs.service }},mode=max
            provenance: false
            sbom: false

        - name: Scan de l'image (Trivy)
          uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
          with:
            image-ref: ${{ steps.meta.outputs.tags }}
            version: ${{ env.TRIVY_VERSION }}
            severity: 'HIGH,CRITICAL'
            ignore-unfixed: true
            exit-code: '1'

        - name: Connexion à GHCR
          if: github.event_name == 'push'
          uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Push de l'image vérifiée
          id: push
          if: github.event_name == 'push'
          run: |
            TAG="${{ steps.meta.outputs.tags }}"
            docker push "$TAG"
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$TAG" | awk -F'@' '{print $2}')
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
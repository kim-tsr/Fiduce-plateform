name: auth

on:
  pull_request:
    paths:
      - "services/auth/**"
      - "libs/**"
      - "pyproject.toml"
      - ".github/workflows/auth.yml"
  push:
    branches: [master]
    paths:
      - "services/auth/**"
      - "libs/**"
      - "pyproject.toml"
      - ".github/workflows/auth.yml"

permissions:
  contents: read

concurrency:
  group: auth-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fiduce-auth

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Lint Python (ruff)
        run: pipx run ruff==0.16.8 check services/auth libs

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: services/auth/Dockerfile
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Détection de secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: SAST (Semgrep)
        run: >
          pipx run semgrep==1.179.0 scan
          --config p/python
          --config p/owasp-top-ten
          --error
          --metrics=off
          services/auth libs
  sca:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: SCA (Trivy, dépendances Python)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: 'services/auth'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
  build:
    needs: [lint, secrets, sast, sca]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Calcul des tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
      - name: Build unique (chargement local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: services/auth/Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            fiduce-auth:scan
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=auth
          cache-to: type=gha,scope=auth,mode=max

      - name: Scan de l'image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: fiduce-auth:scan
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push de l'image vérifiée
        id: push
        if: github.event_name == 'push'
        run: |
          TAG="${{ steps.meta.outputs.tags }}"
          docker push "$TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$TAG" | awk -F'@' '{print $2}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
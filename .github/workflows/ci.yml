name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
              - '.github/workflows/_image.yml'
            python: &python
              - *ci
              - 'libs/**'
              - 'pyproject.toml'
            auth:
              - *python
              - 'services/auth/**'
            gateway:
              - *python
              - 'services/gateway/**'
            ledger:
              - *python
              - 'services/ledger/**'
            reporting:
              - *python
              - 'services/reporting/**'
            worker:
              - *python
              - 'services/worker/**'
            web:
              - *ci
              - 'web/**'
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Python (ruff)
        run: pipx run ruff==0.16.8 check services/auth libs

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: services/auth/Dockerfile
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Détection de secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SAST (Semgrep)
        run: >
          pipx run semgrep==1.179.0 scan
          --config p/python
          --config p/owasp-top-ten
          --error
          --metrics=off
          services/auth libs
  sca:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SCA (Trivy, dépendances Python)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'services/auth'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
  image:
    needs: [changes, lint, secrets, sast]
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      service: ${{ matrix.service }}
      context: ${{ matrix.service == 'web' && 'web' || '.' }}
      dockerfile: ${{ matrix.service == 'web' && 'web/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
      push: ${{ github.event_name == 'push' }}        